[package]
name = "slop-video-compositor"
version = "0.2.0"
description = "Desktop hard-cut video compositor: multi-track timeline, filmstrips, audio beds, reframe, export H.264+AAC MP4"
authors = ["Meigo"]
license = "MIT"
repository = "https://github.com/meigo/slop-video-compositor"
homepage = "https://github.com/meigo/slop-video-compositor"
keywords = ["tauri", "video", "compositor", "ffmpeg", "nle"]
categories = ["multimedia"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "slop_video_compositor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"
